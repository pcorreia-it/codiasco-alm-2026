<title>Codiasco @ ALM 2026</title>
<style>
:root{--ink:#253129;--green:#3d8e42;--green-dark:#2f7136;--cream:#f3ebdd;--display:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{font-family:var(--display);color:var(--ink);
  background:linear-gradient(100deg,rgba(243,235,221,.94) 0 44%,rgba(243,235,221,.72) 68%,rgba(43,45,39,.22)),url(assets/cover.jpg);
  background-size:cover;background-position:center;background-attachment:fixed;
  display:flex;align-items:center;justify-content:center;padding:clamp(1rem,4vw,3rem)}
.wrap{width:min(46rem,100%);min-width:0;max-width:100%;overflow-x:hidden;background:rgba(250,246,238,.72);backdrop-filter:blur(6px);
  border:1px solid rgba(37,49,41,.14);border-radius:1.4rem;box-shadow:0 18px 60px rgba(37,49,41,.16);
  padding:clamp(1.4rem,4.5vw,3rem)}
.mast{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:clamp(1.2rem,4vw,2.2rem)}
.brand{width:clamp(9rem,26vw,13rem);height:auto;aspect-ratio:749/181;color:var(--ink)}
.event{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green-dark);white-space:nowrap}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green-dark);margin-bottom:.9rem}
h1{font-size:clamp(1.35rem,3.4vw,2.1rem);line-height:1.22;font-weight:850;margin-bottom:clamp(1.4rem,4vw,2rem)}
h1 em{font-style:italic;color:var(--green-dark)}
.choose{font-size:clamp(1rem,2.4vw,1.2rem);font-weight:800;margin-bottom:1rem}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(11rem,100%),1fr));gap:.7rem;margin-bottom:1.6rem}
.langs a{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  min-height:3.4rem;padding:.8rem 1.1rem;border-radius:.9rem;text-decoration:none;
  background:var(--green);color:#fff;font-weight:800;font-size:1.02rem;
  border:1px solid rgba(37,49,41,.18);box-shadow:0 6px 18px rgba(37,49,41,.14);
  transition:background .15s,transform .15s}
.langs a:hover,.langs a:focus-visible{background:var(--green-dark);transform:translateY(-1px)}
.langs a small{font-size:.7rem;font-weight:700;letter-spacing:.1em;opacity:.85}
.present{font-size:.85rem}
.present a{color:var(--ink);opacity:.72;text-decoration:underline;text-underline-offset:3px}
.present a:hover,.present a:focus-visible{opacity:1;color:var(--green-dark)}
@media(max-width:520px){.mast{flex-direction:column;align-items:flex-start;gap:.5rem}}
</style>
