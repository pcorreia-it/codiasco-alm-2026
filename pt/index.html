.lvl.on .lvl-ring{stroke:var(--red);stroke-width:4.5}

let lang='pt',current=0,t0=null,timerId=null,autoId=null,ppmI=0,yearI=0,routeI=0,isMobile=matchMedia('(max-width:720px)').matches;

function rail(active){return `<div class="chapter-rail${active==='all'?' all':''}" data-chapter="${active}">${Object.entries(chapters).map(([k,v])=>`<div class="chapter-dot${active==='all'||active===k?' on':''}" data-n="${v.n[lang]}">${I(v.i)}</div>`).join('')}</div>`}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-ui]').forEach(el=>el.textContent=L[lang][el.dataset.ui]);deck.innerHTML=slides.map((s,i)=>`<section class="slide ${s.cls||''}${i===current?' active':''}" data-slide="${i}" aria-label="${i+1} of ${slides.length}"><header class="mast"><svg class="brand" role="img" aria-label="Codiasco"><use href="#logo-codiasco"></use></svg><div class="event">ITCILO · ALM 2026</div>${rail(s.c)}</header>${s.cls==='cover'?`<div class="stage">${s.body(lang)}</div>`:`<p class="eyebrow">${s.k[lang]}</p><h1 class="headline">${s.h[lang]}</h1><p class="deckline">${s.d[lang]}</p><div class="stage">${s.body(lang)}</div>`}<div class="source">${s.src[lang]}</div><div class="slide-no">${String(i+1).padStart(2,'0')}</div></section>`).join('');document.getElementById('total').textContent=slides.length;bindDynamic();buildMenu();buildImages();update();if(isMobile)setupObserver()}
function bindDynamic(){document.querySelectorAll('[data-ppm]').forEach(el=>el.onclick=()=>{ppmI=+el.dataset.ppm;drawPPM()});document.querySelectorAll('[data-year]').forEach(el=>el.onclick=()=>{yearI=+el.dataset.year;drawYear()});const c=document.getElementById('copyMail');if(c)c.onclick=async()=>{try{await navigator.clipboard.writeText('info@codiasco.org');c.textContent=L[lang].copied}catch{c.textContent='info@codiasco.org'}};drawPPM();drawYear();drawRoute()}
function update(){document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',isMobile||i===current));curEl.textContent=current+1;progress.style.width=((current+1)/slides.length*100)+'%';announce.textContent=`${current+1}/${slides.length}: ${strip(slides[current].h[lang])}`;document.getElementById('notesTitle').textContent=`${current+1}/${slides.length} — ${strip(slides[current].h[lang])}`;document.getElementById('notesText').textContent=slides[current].note[lang];syncFrags();startAuto();}
function go(i,fromBack){const prev=current;current=Math.max(0,Math.min(slides.length-1,i));if(current!==prev){if(cyc[current])cyc[current].set(fromBack?cyc[current].n()-1:0);fragI=fromBack?1e9:0}if(isMobile){update();document.querySelector(`[data-slide="${current}"]`).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}else update()}

const cyc={4:{n:()=>ppm.length,get:()=>ppmI,set:v=>{ppmI=v;drawPPM()}},5:{n:()=>years.length,get:()=>yearI,set:v=>{yearI=v;drawYear()}},8:{n:()=>3,get:()=>routeI,set:v=>{routeI=v;drawRoute()}}};
function fragEls(){const s=document.querySelector(`.slide[data-slide="${current}"]`);return s?[...s.querySelectorAll('[data-frag]')]:[]}
function syncFrags(){const els=fragEls();fragMax=els.reduce((m,e)=>Math.max(m,+e.dataset.frag),-1);fragI=Math.min(fragI,Math.max(fragMax,0));applyFrags()}
function applyFrags(){const all=isMobile||matchMedia('(prefers-reduced-motion:reduce)').matches;fragEls().forEach(e=>e.classList.toggle('frag-on',all||+e.dataset.frag<=fragI))}
function stepCount(){return cyc[current]?cyc[current].n():fragMax+1}
function curStep(){return cyc[current]?cyc[current].get():fragI}
function setStep(v){if(cyc[current]){cyc[current].set(v);startAuto()}else{fragI=v;applyFrags()}}
function advance(dir){if(isMobile){go(current+dir);return}const n=stepCount(),s=curStep();if(dir>0){if(s<n-1)setStep(s+1);else go(current+1)}else{if(s>0)setStep(s-1);else go(current-1,true)}}
function startAuto(){clearInterval(autoId);if(paused||matchMedia('(prefers-reduced-motion:reduce)').matches)return;if(current===4){drawPPM();autoId=setInterval(()=>{ppmI=(ppmI+1)%ppm.length;drawPPM()},20000)}else if(current===5){drawYear();autoId=setInterval(()=>{yearI=(yearI+1)%years.length;drawYear()},20000)}else if(current===8){drawRoute();autoId=setInterval(()=>{routeI=(routeI+1)%3;drawRoute()},20000)}}
function drawPPM(){document.querySelectorAll('[data-ppm]').forEach((x,i)=>x.classList.toggle('on',i===ppmI));const x=ppm[ppmI],a=document.getElementById('ppmStage');if(!a)return;a.textContent=`${String(ppmI+1).padStart(2,'0')} · ${x.t[lang]}`;document.getElementById('ppmTitle').textContent=x.s[lang];document.getElementById('ppmEvidence').textContent=x.e[lang];document.getElementById('ppmOrder').textContent=`${ppmI+1} / 6`}
function drawYear(){document.querySelectorAll('[data-year]').forEach((x,i)=>x.classList.toggle('on',i===yearI))}
function drawRoute(){for(let i=0;i<3;i++){document.getElementById('route'+i)?.classList.toggle('on',i===routeI);document.getElementById('end'+i)?.classList.toggle('on',i===routeI)}document.querySelectorAll('[data-project]').forEach((x,i)=>x.classList.toggle('on',i===routeI))}
function buildMenu(){document.getElementById('menuList').innerHTML=slides.map((s,i)=>`<button data-go="${i}"><span>${String(i+1).padStart(2,'0')}</span><strong>${strip(s.h[lang])}</strong></button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{document.getElementById('menuDialog').close();go(+b.dataset.go)})}
/* — Créditos fotográficos. CC BY e CC BY-SA exigem: autor, título da obra,
   licença NOMEADA com LINK e indicação das modificações. A lista é gerada na
   língua da rota; as obras vêm do Wikimedia Commons. Os links de licença são
   href estáticos: não disparam requisição (o deck segue offline-first). — */
const LIC={by4:{n:'CC BY 4.0',u:'https://creativecommons.org/licenses/by/4.0/'},bysa4:{n:'CC BY-SA 4.0',u:'https://creativecommons.org/licenses/by-sa/4.0/'},by3it:{n:'CC BY 3.0 IT',u:'https://creativecommons.org/licenses/by/3.0/it/deed.it'},cc0:{n:'CC0 1.0',u:'https://creativecommons.org/publicdomain/zero/1.0/'},pd:{n:'',u:''}};
const CRED=[
 {s:'cover',t:'Salone del Gusto 2016, Piazza Castello, Torino',a:'Alessandro Vargiu',c:'by4',m:1},
 {s:'2',t:'Uganda Nutrition',a:'USAID in Africa',c:'pd',m:0},
 {s:'7',t:'Mercato Porta Palazzo, Torino',a:'Tosca59',c:'cc0',m:0},
 {s:'10',t:'Argan Oil Cooperative 01',a:'Catalin Dordea',c:'bysa4',m:1},
 {s:'11',t:'Hands picking coffee beans from coffee tree',a:'Saddymonster',c:'bysa4',m:0},
 {s:'11',t:'Mercato di Porta Palazzo, bancarella con ceste di frutta',a:'Mario Gabinio',c:'by3it',m:0,d:1}
];
function buildImages(){
 const box=document.getElementById('imageList');if(!box)return;const l=lang;
 const lbl=s=>s==='cover'?P(l,'Cover','Couverture','Capa','Copertina','封面'):P(l,'Slide '+s,'Diapositive '+s,'Slide '+s,'Diapositiva '+s,'第'+s+'页');
 const dec=P(l,'(1930s)','(années 1930)','(anos 1930)','(anni 1930)','（1930年代）');
 const pd=P(l,'public domain','domaine public','domínio público','pubblico dominio','公有领域');
 const mod=P(l,'Modified by Codiasco: colour treatment (duotone veil) applied to the original.','Modifiée par Codiasco\u00a0: traitement chromatique (voile duotone) appliqué à l’original.','Modificada pela Codiasco: tratamento cromático (véu duotônico) aplicado ao original.','Modificata da Codiasco: trattamento cromatico (velo duotono) applicato all’originale.','由Codiasco修改：在原作上应用了色彩处理（双色调蒙版）。');
 const nomod=P(l,'Not modified.','Non modifiée.','Sem modificações.','Non modificata.','未作修改。');
 const sa=P(l,'This adaptation is shared under the same licence, CC BY-SA 4.0.','Cette adaptation est diffusée sous la même licence, CC BY-SA 4.0.','Esta adaptação é distribuída sob a mesma licença, CC BY-SA 4.0.','Questo adattamento è distribuito con la stessa licenza, CC BY-SA 4.0.','本改作依同一许可协议 CC BY-SA 4.0 发布。');
 const src=P(l,'Source: Wikimedia Commons.','Source\u00a0: Wikimedia Commons.','Fonte: Wikimedia Commons.','Fonte: Wikimedia Commons.','来源：维基共享资源（Wikimedia Commons）。');
 const note=P(l,'SDG icons (slide 4): official United Nations material, used for non-commercial informational purposes under the UN SDG logo guidelines (May 2020). CeSPI and CSA logos reproduced with the partners’ authorisation.','Icônes ODD (diapositive 4)\u00a0: matériel officiel des Nations unies, utilisé à des fins d’information non commerciales selon les lignes directrices de l’ONU sur l’usage du logo ODD (mai 2020). Logos CeSPI et CSA reproduits avec l’autorisation des partenaires.','Ícones dos ODS (slide 4): material oficial das Nações Unidas, usado para fins informativos não comerciais conforme as diretrizes da ONU para o uso do logo dos ODS (maio de 2020). Logos CeSPI e CSA reproduzidos com autorização dos parceiros.','Icone OSS (diapositiva 4): materiale ufficiale delle Nazioni Unite, utilizzato a fini informativi non commerciali secondo le linee guida ONU per l’uso del logo OSS (maggio 2020). Loghi CeSPI e CSA riprodotti con l’autorizzazione dei partner.','可持续发展目标图标（第4页）：联合国官方素材，依据联合国可持续发展目标标识使用指南（2020年5月）用于非商业信息用途。CeSPI与CSA标识经合作伙伴授权使用。');
 box.innerHTML=CRED.map(x=>{const t=LIC[x.c],lic=t.u?`<a href="${t.u}" target="_blank" rel="license noopener">${t.n}</a>`:pd;
  return `<p class="credit"><b>${lbl(x.s)}</b> · “${x.t}”${x.d?' '+dec:''} — ${x.a} · ${lic}<br><span>${x.m?mod+(x.c==='bysa4'?' '+sa:''):nomod} ${src}</span></p>`}).join('')+`<p class="credit note">${note}</p>`;
}
function strip(x){const d=document.createElement('div');d.innerHTML=x;return d.textContent}
function startTimer(){if(t0)return;t0=Date.now();timerId=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0'),el=document.getElementById('timer');el.textContent=`${m}:${ss}`;el.classList.toggle('warn',s>=18*60+30)},1000)}
function toggleNotes(v){const n=document.getElementById('notes'),open=v??!n.classList.contains('open');n.classList.toggle('open',open);n.setAttribute('aria-hidden',String(!open))}
function setupObserver(){const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.55){current=+e.target.dataset.slide;update()}}),{threshold:[.55]});document.querySelectorAll('.slide').forEach(x=>obs.observe(x))}
document.getElementById('prev').onclick=()=>advance(-1);document.getElementById('next').onclick=()=>advance(1);document.querySelector('.navzone.prev').onclick=()=>advance(-1);document.querySelector('.navzone.next').onclick=()=>advance(1);
const playBtn=document.getElementById('playBtn');playBtn.onclick=()=>{paused=!paused;playBtn.textContent=paused?'▶':'⏸';playBtn.setAttribute('aria-pressed',String(paused));playBtn.setAttribute('aria-label',L[lang][paused?'play':'pause']);startAuto()};
const chromeToggle=document.getElementById('chromeToggle');chromeToggle.onclick=()=>{const min=document.body.classList.toggle('chrome-min');chromeToggle.textContent=min?'«':'»';chromeToggle.setAttribute('aria-expanded',String(!min));chromeToggle.setAttribute('aria-label',L[lang][min?'showCtrls':'hideCtrls'])};
deck.addEventListener('click',e=>{if(isMobile)return;if(e.target.closest('button,a,input,dialog,[data-ppm],[data-year],.notes-drawer'))return;advance(1)});
document.getElementById('menuBtn').onclick=()=>document.getElementById('menuDialog').showModal();document.getElementById('imagesBtn').onclick=()=>document.getElementById('imagesDialog').showModal();document.getElementById('notesBtn').onclick=()=>toggleNotes();document.getElementById('notesClose').onclick=()=>toggleNotes(false);document.getElementById('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).close());
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){if(!e.target.closest('button,dialog'))advance(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp')advance(-1);else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1,true);else if(e.key.toLowerCase()==='l'){location.href='../'+NEXT[lang]+'/'}else if(e.key.toLowerCase()==='a')playBtn.click();else if(e.key==='Escape')toggleNotes(false)});
let touchY=0;document.addEventListener('touchstart',e=>touchY=e.changedTouches[0].clientY,{passive:true});document.addEventListener('touchend',e=>{if(!isMobile)return;const dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dy)>70)go(current+(dy<0?1:-1))},{passive:true});
matchMedia('(max-width:720px)').addEventListener('change',e=>{isMobile=e.matches;render()});render();
</script>
<script>
function groupCapabilityIntro(){
  const intro=document.querySelector('.cover-copy>.deckline');
  const capabilityList=document.querySelector('.five-path');
  if(intro&&capabilityList){intro.classList.add('path-intro');capabilityList.prepend(intro)}
}
function enhanceBusinessComparison(){
  const plot=document.querySelector('.dotplot');
  if(!plot)return;
  const l=document.documentElement.lang;
  const italy=plot.querySelector('.dotlabel.italy');
  const turin=plot.querySelector('.dotlabel.turin');
  const axis=plot.querySelector('.axis');
  if(italy&&italy.dataset.lang!==l){italy.textContent=l==='it'?'Italia (media)':l==='zh'?'意大利（平均）':l==='pt'?'Itália (média)':(l==='fr'?'Italie (moyenne)':'Italy (average)');italy.dataset.lang=l}
  if(turin&&turin.dataset.lang!==l){turin.textContent=l==='it'?'Torino':l==='zh'?'都灵':l==='pt'?'Turim':'Turin';turin.dataset.lang=l}
  let title=axis?.querySelector('.axis-title');
  if(axis&&!title){title=document.createElement('b');title.className='axis-title';axis.append(title)}
  if(title)title.textContent=l==='it'?'Confronto delle imprese guidate da migranti':l==='zh'?'移民领导企业对比':l==='pt'?'Comparação das empresas lideradas por migrantes':(l==='fr'?'Comparaison des entreprises dirigées par des migrants':'Migrant-led businesses comparison');
  plot.setAttribute('aria-label',l==='it'?'Confronto delle imprese guidate da migranti: Torino, 15% del totale delle imprese; media italiana, 12%.':l==='zh'?'移民领导企业对比：都灵占企业总数15%；意大利平均12%。':l==='pt'?'Comparação das empresas lideradas por migrantes: Turim, 15% do total de empresas; média italiana, 12%.':l==='fr'?'Comparaison des entreprises dirigées par des migrants : Turin, 15 % du total des entreprises ; moyenne italienne, 12 %.':'Migrant-led businesses comparison: Turin, 15% of total businesses; Italy average, 12%.');
}
function refineRenderedSlides(){groupCapabilityIntro();enhanceBusinessComparison()}
refineRenderedSlides();
new MutationObserver(refineRenderedSlides).observe(document.getElementById('deck'),{childList:true});
</script>
